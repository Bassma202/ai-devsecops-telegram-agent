name: DevSecOps Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: setup-python@v4
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety flake8
    - name: Run Python Syntax Check & Lint
      run: |
        python -m compileall app bot.py
        flake8 app bot.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
    - name: Run Bandit Security Scan
      run: |
        bandit -r app bot.py -f txt || true
