name: FORGE DevSecOps Supply-Chain CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-tests:
    name: SAST, Policy-as-Code, SBOM & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff static quality check
        run: ruff check src app bot.py tests --select E9,F63,F7,F82

      - name: Bandit SAST (strict gate on src, app, bot.py)
        run: bandit -r src app bot.py --severity-level high

      - name: OPA Rego v1 unit tests
        run: |
          curl -sSL -o /tmp/opa https://openpolicyagent.org/downloads/v1.1.0/opa_linux_amd64_static
          chmod +x /tmp/opa
          /tmp/opa test policies/ -v

      - name: Execute full pytest regression suite
        run: pytest -v

      - name: Run end-to-end FORGE supply-chain demo & SBOM check
        run: python scripts/run_forge_demo.py
