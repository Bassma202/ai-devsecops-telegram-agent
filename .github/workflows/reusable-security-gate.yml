name: FORGE Reusable Python Security Gate

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for security and test execution"
        required: false
        type: string
        default: "3.12"
      source-path:
        description: "Source directory to scan with Bandit and Ruff"
        required: false
        type: string
        default: "src"
      run-pytest:
        description: "Whether to execute pytest suite"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  security-gate:
    name: FORGE SAST, Lint & Unit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install project and security scanners
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install ".[dev]"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install bandit ruff pytest

      - name: Run Ruff static lint checks
        run: ruff check ${{ inputs.source-path }} tests --select E9,F63,F7,F82

      - name: Run Bandit SAST (fail on High/Critical)
        run: bandit -r ${{ inputs.source-path }} --severity-level high

      - name: Run automated test suite
        if: ${{ inputs.run-pytest }}
        run: pytest -q
